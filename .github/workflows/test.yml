# Runs the suite in the same dev shell a developer gets.
#
# This gem is pure Ruby, so there is nothing to cross-compile and no
# per-platform matrix. What it does need is Polkit-1.0.typelib and the glib that
# typelib was built against -- get those from two different places and GIO is
# registered twice in one process, which fails as
# `cannot register existing type 'GTlsCertificate'`.
#
# flake.nix pins all of that and builds GI_TYPELIB_PATH, so CI runs through
# `nix develop` rather than installing packages and hoping the versions line
# up. The shell is the contract, and CI checking a different environment than
# the one people develop in is how an environment bug reaches a release.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the tree is what the flake will see
        run: git status --porcelain

      - name: Run the suite
        run: nix develop --command bin/test

      # The gem must stay pure Ruby: no extension of its own, and no
      # resurrection of the Rust dependencies that were removed. Checked
      # against the built artefact as well as the gemspec, because what ships
      # is what matters.
      #
      # This deliberately does not try `gem install` into a fresh GEM_HOME.
      # The dev shell's ruby comes from bundlerEnv with GEM_HOME baked into
      # the read-only store, so an install there fails on permissions and
      # proves nothing either way. And it would not prove "no toolchain"
      # regardless: glib2 and gobject-introspection are native extensions, so
      # installing this gem does compile C. What is true, and what the README
      # says, is that this gem adds no build step beyond the two every
      # ruby-gnome application already needs.
      - name: The packaged gem is pure Ruby
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            gem build polkit.gemspec
            contents=$(tar -xOf polkit-*.gem data.tar.gz | tar -tzf -)
            echo "$contents"
            if echo "$contents" | grep -qE "(^|/)ext/|\\.rs$|Cargo\\.(toml|lock)|\\.so$"; then
              echo "::error::the packaged gem carries native-extension artefacts"; exit 1
            fi
            ruby -e "
              spec = Gem::Specification.load(\"polkit.gemspec\")
              abort \"gemspec declares extensions: #{spec.extensions}\" unless spec.extensions.empty?
              names = spec.runtime_dependencies.map(&:name).sort
              abort \"unexpected runtime deps: #{names}\" unless names == [\"gem_kit\", \"gobject-introspection\"]
              puts \"packaged gem is pure Ruby; runtime deps: #{names.join(\", \")}\"
            "
          '
